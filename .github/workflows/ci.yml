name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Syntax and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Zero dependencies: no npm install needed.
      - name: Syntax check host entry
        run: node --check index.js

      - name: Syntax check client bundle
        run: node --check client.js

      - name: Unit and contract tests
        run: node --test
